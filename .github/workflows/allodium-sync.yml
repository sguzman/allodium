name: Allodium GitHub Sync

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: allodium-github-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - name: Observe GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked -p allodium-cli -- github observe . github
      - name: Plan projection
        run: |
          cargo run --locked -p allodium-cli -- github plan . github > .allodium-github-plan.toml
          cat .allodium-github-plan.toml
      - name: Apply canonical projection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked -p allodium-cli -- github apply .allodium-github-plan.toml .
      - name: Re-observe applied state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo run --locked -p allodium-cli -- github observe . github
      - name: Validate filesystem state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Commit durable remote state
        shell: bash
        run: |
          git add .project/remotes/github
          meaningful=$(git diff --cached -- .project/remotes/github \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+|[-+]observed_at = )' \
            || true)
          if [[ -z "$meaningful" ]]; then
            echo 'No durable GitHub state change.'
            git restore --staged .project/remotes/github
            git restore .project/remotes/github
            exit 0
          fi

          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(allodium): sync GitHub projection state'

          # main is not a lock. Canonical work may land while observation is running.
          # Replay only this generated state commit onto the newest main; never force-push.
          for attempt in 1 2 3; do
            echo "Sync state push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Generated remote state conflicts with newer main; refusing to guess.' >&2
              git rebase --abort || true
              exit 1
            fi

            cargo run --locked -p allodium-cli -- validate .

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'main kept moving after three safe rebase attempts; refusing force-push.' >&2
          exit 1
