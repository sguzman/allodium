name: One-time stale-write HTTP test patch

on:
  push:
    paths:
      - '.github/workflows/patch-stale-http-test-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Add HTTP-level stale-write proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/allodium-github/src/lib.rs')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: patch anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              '    repository: String,\n    token: Option<String>,\n}',
              '    repository: String,\n    token: Option<String>,\n    api_base: String,\n}',
              'adapter api base field',
          )
          replace_once(
              '        Ok(Self {\n            client,\n            repository: remote.repository,\n            token: github_token_from_environment(),\n        })',
              '        Ok(Self {\n            client,\n            repository: remote.repository,\n            token: github_token_from_environment(),\n            api_base: API_BASE.into(),\n        })',
              'adapter api base default',
          )
          replace_once(
              'self.send(self.request(self.client.get(api_url(path))))',
              'self.send(self.request(self.client.get(self.api_url(path))))',
              'GET api base',
          )
          replace_once(
              'self.send(self.request(self.client.post(api_url(path))).json(payload))',
              'self.send(self.request(self.client.post(self.api_url(path))).json(payload))',
              'POST api base',
          )
          replace_once(
              'self.send(self.request(self.client.patch(api_url(path))).json(payload))',
              'self.send(self.request(self.client.patch(self.api_url(path))).json(payload))',
              'PATCH api base',
          )
          marker = '    fn request(&self, request: RequestBuilder) -> RequestBuilder {'
          if marker not in text:
              raise SystemExit('api_url method insertion anchor not found')
          method = '''    fn api_url(&self, path: &str) -> String {
              format!("{}{}", self.api_base.trim_end_matches('/'), path)
          }

          '''
          text = text.replace(marker, method + marker, 1)
          replace_once(
              'fn api_url(path: &str) -> String {\n    format!("{API_BASE}{path}")\n}\n\n',
              '',
              'old global api_url',
          )

          marker = '    fn test_root(name: &str) -> PathBuf {'
          if marker not in text:
              raise SystemExit('stale HTTP test insertion anchor not found')
          test = r'''    #[test]
              fn stale_update_is_rejected_before_patch_is_sent() {
                  use std::io::{Read, Write};
                  use std::net::TcpListener;
                  use std::sync::atomic::{AtomicBool, Ordering};
                  use std::sync::{Arc, Mutex};
                  use std::thread;
                  use std::time::Duration;

                  let root = test_root("stale-http");
                  fs::create_dir_all(root.join(".project/issues/issue-0007")).unwrap();
                  fs::write(
                      root.join(".project/issues/issue-0007/issue.toml"),
                      "schema = \"allodium.issue/v0\"\nid = \"issue-0007\"\ntitle = \"Canonical title\"\nstate = \"open\"\nlabels = []\n",
                  )
                  .unwrap();
                  fs::write(root.join(".project/issues/issue-0007/body.md"), "Canonical body").unwrap();
                  fs::create_dir_all(root.join(".project/remotes/github/observed/issues")).unwrap();
                  fs::write(
                      root.join(".project/remotes/github/remote.toml"),
                      "schema = \"allodium.remote/v0\"\nname = \"github\"\nkind = \"github\"\nrepository = \"owner/repo\"\noutbound = \"reconcile\"\ninbound = \"archive\"\n",
                  )
                  .unwrap();
                  fs::write(
                      root.join(".project/remotes/github/observed/issues/issue-0007.revision.toml"),
                      "schema = \"allodium.github.observed-revision/v0\"\ncanonical_id = \"issue-0007\"\nnumber = 7\nremote_updated_at = \"2026-09-16T10:00:00Z\"\nobserved_at = \"2026-09-16T10:01:00Z\"\n",
                  )
                  .unwrap();

                  let listener = TcpListener::bind("127.0.0.1:0").unwrap();
                  listener.set_nonblocking(true).unwrap();
                  let address = listener.local_addr().unwrap();
                  let requests = Arc::new(Mutex::new(Vec::<String>::new()));
                  let server_requests = Arc::clone(&requests);
                  let stop = Arc::new(AtomicBool::new(false));
                  let server_stop = Arc::clone(&stop);
                  let server = thread::spawn(move || {
                      while !server_stop.load(Ordering::SeqCst) {
                          match listener.accept() {
                              Ok((mut stream, _)) => {
                                  stream.set_read_timeout(Some(Duration::from_secs(1))).unwrap();
                                  let mut buffer = [0_u8; 8192];
                                  let size = stream.read(&mut buffer).unwrap();
                                  let request = String::from_utf8_lossy(&buffer[..size]);
                                  let request_line = request.lines().next().unwrap_or_default().to_string();
                                  server_requests.lock().unwrap().push(request_line);
                                  let body = r#"{"number":7,"html_url":"https://github.com/owner/repo/issues/7","title":"Changed remotely","body":"Remote body","state":"open","updated_at":"2026-09-16T10:02:00Z"}"#;
                                  let response = format!(
                                      "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: {}\r\nConnection: close\r\n\r\n{}",
                                      body.len(), body
                                  );
                                  stream.write_all(response.as_bytes()).unwrap();
                              }
                              Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {
                                  thread::sleep(Duration::from_millis(5));
                              }
                              Err(error) => panic!("fake GitHub server failed: {error}"),
                          }
                      }
                  });

                  let adapter = GitHubAdapter {
                      client: Client::builder().build().unwrap(),
                      repository: "owner/repo".into(),
                      token: Some("test-token".into()),
                      api_base: format!("http://{address}"),
                  };
                  let plan = GitHubPlan {
                      schema: PLAN_SCHEMA_V0.into(),
                      remote: "github".into(),
                      repository: "owner/repo".into(),
                      operations: vec![allodium_core::github::GitHubOperation {
                          canonical_id: "issue-0007".into(),
                          action: "update_issue".into(),
                          number: Some(7),
                          fields: vec!["title".into()],
                          reason: "HTTP stale-write regression".into(),
                      }],
                  };

                  let error = adapter.apply(&root, &plan).unwrap_err();
                  assert!(error.contains("refusing stale update of issue-0007"));
                  stop.store(true, Ordering::SeqCst);
                  server.join().unwrap();
                  let requests = requests.lock().unwrap();
                  assert_eq!(requests.len(), 1, "stale apply emitted an unexpected second HTTP request: {requests:?}");
                  assert!(requests[0].starts_with("GET /repos/owner/repo/issues/7 "));

                  fs::remove_dir_all(root).unwrap();
              }

          '''
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --workspace --locked
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/allodium-github/src/lib.rs
          git commit -m 'test: prove stale GitHub updates fail before PATCH'
          git push
