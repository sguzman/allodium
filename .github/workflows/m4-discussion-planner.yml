name: M4 discussion planner gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-discussion-planner.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Wire offline planner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/allodium-core/src/lib.rs')
          text = path.read_text()
          if 'pub mod github_discussion;\n' not in text:
              text = text.replace('pub mod github;\n', 'pub mod github;\npub mod github_discussion;\n', 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
      - name: Publish clean planner
        run: |
          set -euo pipefail
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m4-discussion-planner.yml
          git add crates/allodium-core/src/lib.rs crates/allodium-core/src/github_discussion.rs
          git commit -m 'feat(core): model GitHub Discussions offline'
          git fetch origin main
          git rebase origin/main
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          git push origin HEAD:main
