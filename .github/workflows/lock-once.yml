name: One-time lockfile

on:
  push:
    paths:
      - '.github/workflows/lock-once.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - name: Generate Rust 1.85 lockfile
        run: |
          cargo generate-lockfile
          cargo update -p yoke-derive --precise 0.8.2
          cargo test --workspace --locked
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: lock Rust 1.85-compatible dependencies'
          git push
