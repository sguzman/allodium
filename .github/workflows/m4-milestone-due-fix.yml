name: M4 milestone due fix gate

on:
  push:
    branches: [main]
    paths:
      - '.github/m4-milestone-due-fix.py'
      - '.github/workflows/m4-milestone-due-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply due-date fix
        run: python .github/m4-milestone-due-fix.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Smoke combined GitHub plan
        run: |
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/plan.toml
          grep -q 'action = "create_milestone"' /tmp/plan.toml
      - name: Publish and self-clean
        run: |
          rm .github/m4-milestone-due-fix.py
          rm .github/workflows/m4-milestone-due-fix.yml
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(github): omit absent milestone due date'
          git pull --rebase origin main
          git push origin HEAD:main
