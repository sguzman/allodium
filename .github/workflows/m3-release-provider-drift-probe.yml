name: M3 Release Provider Drift Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-release-provider-drift-probe.yml'

permissions:
  contents: write

jobs:
  mutate-provider-release:
    runs-on: ubuntu-latest
    steps:
      - name: Edit GitHub draft release outside Allodium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: '390189282'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -d '{"name":"PROVIDER DRIFT — Allodium M3 dogfood"}' \
            >/tmp/release.json
          python3 - <<'PY'
          import json
          release = json.load(open('/tmp/release.json', encoding='utf-8'))
          assert release['id'] == 390189282
          assert release['name'] == 'PROVIDER DRIFT — Allodium M3 dogfood'
          assert release['draft'] is True
          assert release['tag_name'] == 'v0.0.0-m3-dogfood'
          PY
