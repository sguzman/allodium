name: One-time review runtime rescue

on:
  push:
    paths:
      - '.github/workflows/patch-review-runtime-rescue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Recover and run runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/patch-review-runtime-once.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          out = []
          in_triple = False
          for line in lines[start:end]:
              recovered = line if in_triple else (line[10:] if line.startswith('          ') else line)
              out.append(recovered)
              if recovered.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path('/tmp/review-runtime-patch.py').write_text('\n'.join(out) + '\n')
          PY
          python /tmp/review-runtime-patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --workspace
      - name: Commit tested runtime and clean helpers
        shell: bash
        run: |
          git config user.name 'Allodium implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/allodium-github/src/lib.rs
          git rm .github/workflows/patch-review-runtime-once.yml
          git rm .github/workflows/patch-review-runtime-rescue.yml
          git commit -m 'feat: add GitHub review lifecycle runtime'
          git push origin HEAD:main
