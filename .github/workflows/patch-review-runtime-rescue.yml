name: One-time review runtime rescue

on:
  push:
    paths:
      - '.github/workflows/patch-review-runtime-rescue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Recover and run runtime patch
        shell: bash
        run: |
          python -c 'from pathlib import Path; lines=Path(".github/workflows/patch-review-runtime-once.yml").read_text().splitlines(); start=next(i for i,x in enumerate(lines) if x.strip()=="python - <<'"'"'PY'"'"'")+1; end=next(i for i in range(start,len(lines)) if lines[i].strip()=="PY"); out=[x[10:] if x.startswith("          ") else x for x in lines[start:end]]; Path("/tmp/review-runtime-patch.py").write_text("\n".join(out)+"\n")'
          python /tmp/review-runtime-patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --workspace
      - name: Commit tested runtime and clean helpers
        shell: bash
        run: |
          git config user.name 'Allodium implementation'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/allodium-github/src/lib.rs
          git rm .github/workflows/patch-review-runtime-once.yml
          git rm .github/workflows/patch-review-runtime-rescue.yml
          git commit -m 'feat: add GitHub review lifecycle runtime'
          git push origin HEAD:main
