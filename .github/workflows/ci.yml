name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Validate Allodium state
        run: cargo run -p allodium-cli -- validate .
