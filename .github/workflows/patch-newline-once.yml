name: One-time semantic body comparison patch

on:
  push:
    paths:
      - '.github/workflows/patch-newline-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Patch semantic body comparison
        run: sed -i 's/if old_body != new_body {/if old_body.trim_end() != new_body.trim_end() {/' crates/allodium-github/src/lib.rs
      - name: Verify
        run: |
          cargo fmt --all
          cargo test --workspace --locked
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/allodium-github/src/lib.rs
          git commit -m 'fix: ignore trailing newline in remote body drift'
          git push
