name: M4 milestone core gate

on:
  push:
    paths:
      - .github/workflows/m4-milestone-core.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply milestone core patch
        run: python .github/m4-milestone-core.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Publish and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/m4-milestone-core.py .github/workflows/m4-milestone-core.yml
          git add crates/allodium-core/src/lib.rs crates/allodium-core/src/milestone.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(core): add canonical milestone validation'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving; refusing force-push' >&2
          exit 1
