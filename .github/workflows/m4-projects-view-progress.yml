name: M4 Projects view progress recorder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'

      - name: Record canonical ProjectV2 view runtime progress
        shell: bash
        run: |
          set -euo pipefail
          python .github/m4-projects-view-progress.py
          cargo run --locked -p allodium-cli -- validate .
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m4-projects-view-progress.yml
          git rm .github/m4-projects-view-progress.py
          git add .project/issues/issue-0011/body.md
          git commit -m 'docs(project): record ProjectV2 view runtime'
          git fetch origin main
          git rebase origin/main
          cargo run --locked -p allodium-cli -- validate .
          git push origin HEAD:main
