name: One-time rustfmt

on:
  push:
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git add crates
          git commit -m 'style: apply rustfmt to GitHub adapter'
          git push
