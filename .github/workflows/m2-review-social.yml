name: M2 Review Social Ingress Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-review-social.yml'
      - '.github/allodium-m2-review-social.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply review social ingress patch
        run: python3 .github/allodium-m2-review-social.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Commit product patch and remove helper
        shell: bash
        run: |
          git rm .github/allodium-m2-review-social.py .github/workflows/m2-review-social.yml
          git add crates/allodium-github/src/lib.rs crates/allodium-github/src/review_ingress.rs crates/allodium-cli/src/main.rs .github/workflows/allodium-sync.yml
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(github): archive pull request social provenance'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Product patch conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
