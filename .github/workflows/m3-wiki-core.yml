name: M3 Wiki Core Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-wiki-core.yml'
      - '.github/allodium-m3-wiki-core.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply canonical wiki patch
        run: python3 .github/allodium-m3-wiki-core.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Commit source patch
        shell: bash
        run: |
          git add crates/allodium-core/src/lib.rs crates/allodium-core/src/wiki.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(core): enforce canonical wiki contract'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Wiki core patch conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
