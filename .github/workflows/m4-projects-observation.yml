name: M4 Projects observation gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-projects-observation.yml'
      - '.github/m4-projects-observation.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Materialize ProjectV2 observation runtime
        run: |
          python .github/m4-projects-observation.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/projects-observation-plan.toml
          cat /tmp/projects-observation-plan.toml
          grep -q 'action = "projects_auth_required"' /tmp/projects-observation-plan.toml
          if grep -Eq 'action = "(delete_project|delete_project_item)"' /tmp/projects-observation-plan.toml; then
            echo 'ProjectV2 observation increment unexpectedly planned destructive work' >&2
            exit 1
          fi
      - name: Publish clean ProjectV2 observation runtime
        run: |
          set -euo pipefail
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m4-projects-observation.yml
          git rm .github/m4-projects-observation.py
          git add crates/allodium-core/src/github_project_observation.rs
          git add crates/allodium-core/src/lib.rs
          git add crates/allodium-github/src/project.rs
          git add crates/allodium-github/src/lib.rs
          git add crates/allodium-cli/src/main.rs
          git add docs/github-projects-provider-v0.md
          git commit -m 'feat(github): observe ProjectV2 provider state'
          git fetch origin main
          git rebase origin/main
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/rebased-projects-observation-plan.toml
          grep -q 'action = "projects_auth_required"' /tmp/rebased-projects-observation-plan.toml
          if grep -Eq 'action = "(delete_project|delete_project_item)"' /tmp/rebased-projects-observation-plan.toml; then
            echo 'ProjectV2 observation increment unexpectedly planned destructive work after rebase' >&2
            exit 1
          fi
          git push origin HEAD:main
