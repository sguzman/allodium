      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Offline plan smoke test
        run: cargo run --locked -p allodium-cli -- github plan . github
      - name: Commit source patch
        shell: bash
        run: |
          git add crates/allodium-github/src/lib.rs crates/allodium-github/src/wiki.rs crates/allodium-cli/src/main.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(github): add GitHub Wiki transport runtime'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Wiki runtime patch conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            cargo run --locked -p allodium-cli -- github plan . github >/dev/null
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
