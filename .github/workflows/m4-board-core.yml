name: M4 board core gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-board-core.yml'
      - '.github/m4-board-core.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Materialize canonical board core
        run: |
          python .github/m4-board-core.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
      - name: Publish clean board core
        run: |
          set -euo pipefail
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m4-board-core.yml
          git rm .github/m4-board-core.py
          git add crates/allodium-core/src/board.rs
          git add crates/allodium-core/src/lib.rs
          git add crates/allodium-core/tests/fixtures_validation.rs
          git add crates/allodium-core/tests/fixtures/valid-board
          git add crates/allodium-core/tests/fixtures/invalid-board-value
          git add crates/allodium-github/src/discussion_ingress.rs
          git add .project/boards/board-0001
          git add docs/boards-v0.md
          git commit -m 'feat(core): add canonical board model'
          git fetch origin main
          git rebase origin/main
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          git push origin HEAD:main
