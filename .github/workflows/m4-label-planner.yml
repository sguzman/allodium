name: M4 label planner gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - name: Apply label planner integration
        run: python .github/allodium-m4-label-planner.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Smoke combined projection plan
        run: |
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/allodium-plan.toml
          grep -q 'canonical_id = "label-allodium"' /tmp/allodium-plan.toml
          grep -q 'action = "create_label"' /tmp/allodium-plan.toml
      - name: Publish product and self-clean
        run: |
          rm .github/allodium-m4-label-planner.py
          rm .github/workflows/m4-label-planner.yml
          git add crates/allodium-core/src/github_label.rs crates/allodium-core/src/lib.rs crates/allodium-cli/src/main.rs .github
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(github): add label projection planner'
          git push origin HEAD:main
