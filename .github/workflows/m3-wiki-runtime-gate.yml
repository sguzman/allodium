name: M3 Wiki Runtime Gate v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-wiki-runtime-gate.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply runtime payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/m3-wiki-runtime.yml').read_text()
          marker = "          cat > crates/allodium-github/src/wiki.rs <<'RS'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          RS", start)
          rust = source[start:end]
          Path('crates/allodium-github/src/wiki.rs').write_text(
              '\n'.join(line.lstrip() for line in rust.splitlines()) + '\n'
          )

          lib = Path('crates/allodium-github/src/lib.rs')
          text = lib.read_text()
          anchor = 'mod review_ingress;\n'
          if anchor not in text:
              raise SystemExit('missing runtime module anchor')
          text = text.replace(anchor, 'mod review_ingress;\nmod wiki;\n', 1)

          anchor = '    pub reviews_observed: usize,\n    pub review_conversation_comment_snapshots_archived: usize,\n'
          replacement = '    pub reviews_observed: usize,\n    pub wikis_observed: usize,\n    pub wiki_remote_changes_archived: usize,\n    pub review_conversation_comment_snapshots_archived: usize,\n'
          if anchor not in text:
              raise SystemExit('missing observe report anchor')
          text = text.replace(anchor, replacement, 1)

          anchor = '    pub reviews_observed: usize,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\nstruct ObservedRevision'
          replacement = '    pub reviews_observed: usize,\n    pub wikis_observed: usize,\n    pub wikis_updated: usize,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\nstruct ObservedRevision'
          if anchor not in text:
              raise SystemExit('missing apply report anchor')
          text = text.replace(anchor, replacement, 1)

          anchor = '''        for issue in self.fetch_repository_issues()? {
            if issue.pull_request.is_some() || mapped_numbers.contains(&issue.number) {
                continue;
            }
            if archive_unmapped_issue_observation(root, remote_name, &issue, &now())? {
                report.unmapped_issues_archived += 1;
            }
        }

        Ok(report)
'''
          replacement = '''        for issue in self.fetch_repository_issues()? {
            if issue.pull_request.is_some() || mapped_numbers.contains(&issue.number) {
                continue;
            }
            if archive_unmapped_issue_observation(root, remote_name, &issue, &now())? {
                report.unmapped_issues_archived += 1;
            }
        }

        let wiki_report = wiki::observe_wiki(self, root, remote_name)?;
        report.wikis_observed += wiki_report.observed;
        report.wiki_remote_changes_archived += wiki_report.remote_changes_archived;

        Ok(report)
'''
          if anchor not in text:
              raise SystemExit('missing observe integration anchor')
          text = text.replace(anchor, replacement, 1)

          anchor = '''                "update_pull_request" => {
                    let review = require_review(&reviews, &operation.canonical_id)?;
                    self.require_write_token()?;
                    let number = require_number(operation)?;
                    self.assert_review_not_stale(
                        root,
                        &plan.remote,
                        &operation.canonical_id,
                        number,
                    )?;
                    let payload = update_review_payload(review, &operation.fields)?;
                    let updated = self.patch_pull_request(number, &payload)?;
                    write_observed_review(
                        root,
                        &plan.remote,
                        &operation.canonical_id,
                        &updated,
                        &now(),
                    )?;
                    report.reviews_updated += 1;
                }
                other => return Err(format!("unsupported GitHub plan operation {other:?}")),
'''
          replacement = '''                "update_pull_request" => {
                    let review = require_review(&reviews, &operation.canonical_id)?;
                    self.require_write_token()?;
                    let number = require_number(operation)?;
                    self.assert_review_not_stale(
                        root,
                        &plan.remote,
                        &operation.canonical_id,
                        number,
                    )?;
                    let payload = update_review_payload(review, &operation.fields)?;
                    let updated = self.patch_pull_request(number, &payload)?;
                    write_observed_review(
                        root,
                        &plan.remote,
                        &operation.canonical_id,
                        &updated,
                        &now(),
                    )?;
                    report.reviews_updated += 1;
                }
                "observe_wiki" => {
                    let wiki_report = wiki::observe_wiki(self, root, &plan.remote)?;
                    report.wikis_observed += wiki_report.observed;
                }
                "update_wiki" => {
                    wiki::apply_wiki_update(self, root, &plan.remote)?;
                    report.wikis_updated += 1;
                }
                other => return Err(format!("unsupported GitHub plan operation {other:?}")),
'''
          if anchor not in text:
              raise SystemExit('missing apply integration anchor')
          lib.write_text(text.replace(anchor, replacement, 1))

          cli = Path('crates/allodium-cli/src/main.rs')
          text = cli.read_text()
          start = text.index('fn github_plan(')
          end = text.index('\nfn github_observe(', start)
          new_plan = '''fn github_plan(root: PathBuf, remote_name: &str) -> ExitCode {
    let result = allodium_core::github::plan_issues(&root, remote_name).and_then(|mut plan| {
        let review_plan = allodium_core::github::plan_reviews(&root, remote_name)?;
        if plan.remote != review_plan.remote || plan.repository != review_plan.repository {
            return Err(
                "issue and review projection plans disagree about the GitHub remote".into(),
            );
        }
        plan.operations.extend(review_plan.operations);

        let wiki_plan = allodium_core::github_wiki::plan_wiki(&root, remote_name)?;
        if plan.remote != wiki_plan.remote || plan.repository != wiki_plan.repository {
            return Err("GitHub wiki projection plan disagrees about the configured remote".into());
        }
        plan.operations.extend(wiki_plan.operations);
        Ok(plan)
    });

    match result.and_then(|plan| allodium_core::github::plan_to_toml(&plan)) {
        Ok(plan) => {
            print!("{plan}");
            ExitCode::SUCCESS
        }
        Err(error) => fail(error),
    }
}
'''
          text = text[:start] + new_plan + text[end:]

          anchor = '            println!("observed {} GitHub review(s)", report.reviews_observed);\n'
          replacement = anchor + '            println!("observed {} GitHub wiki(s)", report.wikis_observed);\n            println!(\n                "archived {} GitHub Wiki remote-tree change(s)",\n                report.wiki_remote_changes_archived\n            );\n'
          if anchor not in text:
              raise SystemExit('missing observe CLI output anchor')
          text = text.replace(anchor, replacement, 1)

          anchor = '            println!("observed {} GitHub review(s)", report.reviews_observed);\n            ExitCode::SUCCESS\n'
          replacement = '            println!("observed {} GitHub review(s)", report.reviews_observed);\n            println!("observed {} GitHub wiki(s)", report.wikis_observed);\n            println!("updated {} GitHub wiki(s)", report.wikis_updated);\n            ExitCode::SUCCESS\n'
          if anchor not in text:
              raise SystemExit('missing apply CLI output anchor')
          text = text.replace(anchor, replacement, 1)
          cli.write_text(text)
          PY
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Offline plan smoke test
        run: cargo run --locked -p allodium-cli -- github plan . github
      - name: Commit source patch
        shell: bash
        run: |
          git add crates/allodium-github/src/lib.rs crates/allodium-github/src/wiki.rs crates/allodium-cli/src/main.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(github): add GitHub Wiki transport runtime'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Wiki runtime patch conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            cargo run --locked -p allodium-cli -- github plan . github >/dev/null
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
