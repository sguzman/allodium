name: M4 milestone provider drift probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-milestone-drift-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Change GitHub milestone title outside Allodium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"title":"PROVIDER DRIFT — M4 milestone dogfood"}'
          response=$(curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/sguzman/allodium/milestones/1 \
            --data "$body")
          python -c 'import json,sys; data=json.load(sys.stdin); assert data["title"] == "PROVIDER DRIFT — M4 milestone dogfood", data["title"]; print(data["title"])' <<< "$response"
