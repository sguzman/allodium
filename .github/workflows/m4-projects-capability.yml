name: M4 Projects capability bridge gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m4-projects-capability.yml'
      - '.github/m4-projects-capability.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Materialize Projects capability bridge
        run: |
          python .github/m4-projects-capability.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/projects-plan.toml
          cat /tmp/projects-plan.toml
          grep -q 'action = "observe_projects_capabilities"' /tmp/projects-plan.toml
          if grep -q 'action = "projects_runtime_required"' /tmp/projects-plan.toml; then
            echo 'Projects runtime unexpectedly became reachable before capability observation' >&2
            exit 1
          fi
      - name: Publish clean Projects capability bridge
        run: |
          set -euo pipefail
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/m4-projects-capability.yml
          git rm .github/m4-projects-capability.py
          git add crates/allodium-core/src/github_project.rs
          git add crates/allodium-core/src/lib.rs
          git add crates/allodium-github/src/project.rs
          git add crates/allodium-github/src/lib.rs
          git add crates/allodium-cli/src/main.rs
          git add .project/remotes/github/projects.toml
          git commit -m 'feat(github): add Projects capability boundary'
          git fetch origin main
          git rebase origin/main
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo run --locked -p allodium-cli -- validate .
          cargo run --locked -p allodium-cli -- github plan . github > /tmp/rebased-projects-plan.toml
          grep -q 'action = "observe_projects_capabilities"' /tmp/rebased-projects-plan.toml
          if grep -q 'action = "projects_runtime_required"' /tmp/rebased-projects-plan.toml; then
            echo 'Projects runtime unexpectedly became reachable after rebase' >&2
            exit 1
          fi
          git push origin HEAD:main
