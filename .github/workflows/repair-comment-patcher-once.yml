name: Repair comment absence patcher once

on:
  push:
    paths:
      - '.github/workflows/repair-comment-patcher-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace brittle loop anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/patch-comment-absence-once.yml')
          text = path.read_text()
          start = text.index("          old_loop = '''")
          end_marker = "          replace_once(old_loop, new_loop, 'mapped comment observation loop')\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''          loop_start = text.find('            for comment in self.fetch_issue_comments(mapping.number)? {')
          if loop_start < 0:
              raise SystemExit('mapped comment loop start not found')
          loop_end_marker = '\\n        }\\n\\n        for issue in self.fetch_repository_issues()?'
          loop_end = text.find(loop_end_marker, loop_start)
          if loop_end < 0:
              raise SystemExit('mapped comment loop end not found')
          new_loop = '''            let comments = self.fetch_issue_comments(mapping.number)?;
              let current_comment_ids = comments
                  .iter()
                  .map(|comment| comment.id)
                  .collect::<BTreeSet<_>>();
              for comment in comments {
                  match archive_comment_observation(
                      root,
                      remote_name,
                      &canonical_id,
                      mapping.number,
                      &comment,
                      &now(),
                  )? {
                      CommentArchive::Created => report.comments_archived += 1,
                      CommentArchive::Edited => report.comment_edits_archived += 1,
                      CommentArchive::Unchanged => {}
                  }
              }
              report.comment_disappearances_archived += archive_missing_comment_observations(
                  root,
                  remote_name,
                  &canonical_id,
                  mapping.number,
                  &current_comment_ids,
                  &now(),
              )?;'''
          text = text[:loop_start] + new_loop + text[loop_end:]
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git config user.name 'Allodium automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/repair-comment-patcher-once.yml
          git add .github/workflows/patch-comment-absence-once.yml
          git commit -m 'chore: harden comment absence patcher'
          git push
