name: M3 Release Identity Fix Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/allodium-m3-release-identity-fix.py'
      - '.github/workflows/m3-release-identity-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply release identity fix
        run: python3 .github/allodium-m3-release-identity-fix.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Offline GitHub plan smoke test
        run: cargo run --locked -p allodium-cli -- github plan . github >/tmp/allodium-plan.toml || true
      - name: Commit source repair
        shell: bash
        run: |
          git add crates/allodium-core/src/github_release.rs crates/allodium-github/src/release.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(github): preserve and repair draft release tag attachment drift'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Release identity repair conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
