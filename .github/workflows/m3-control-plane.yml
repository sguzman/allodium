name: M3 Control Plane Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/allodium-m3-control-plane.py'
      - '.github/workflows/m3-control-plane.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt
      - name: Apply M3 control-plane patch
        run: python3 .github/allodium-m3-control-plane.py
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Validate Allodium state
        run: cargo run --locked -p allodium-cli -- validate .
      - name: Offline GitHub plan smoke test
        run: cargo run --locked -p allodium-cli -- github plan . github > /tmp/allodium-plan.toml
      - name: Commit source integration
        shell: bash
        run: |
          git add crates/allodium-core/src/lib.rs crates/allodium-core/src/github_wiki.rs crates/allodium-core/src/github_release.rs crates/allodium-github/src/lib.rs crates/allodium-cli/src/main.rs
          git config user.name 'Allodium implementation gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(github): isolate wiki bootstrap and integrate release planning'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'M3 control-plane integration conflicts with newer main; refusing to guess.' >&2
              exit 1
            fi
            cargo fmt --all -- --check
            cargo test --locked --workspace
            cargo run --locked -p allodium-cli -- validate .
            cargo run --locked -p allodium-cli -- github plan . github >/dev/null
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'main kept moving after three safe attempts; refusing force-push.' >&2
          exit 1
